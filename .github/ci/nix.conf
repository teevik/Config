extra-experimental-features = parallel-eval
eval-cores = 2
max-jobs = 1
cores = 4
# Reclaim unused, already-uploaded build inputs under disk pressure.
min-free = 8589934592
max-free = 21474836480
# A just-published path must not remain a cached miss for an hour.
narinfo-cache-negative-ttl = 0
lazy-trees = true
accept-flake-config = true
connect-timeout = 15
fallback = true
# Public paths use the CDN directly; ncps advertises priority 10.
# Keep the private cache for custom outputs and other upstreams.
substituters = https://cache.nixos.org?priority=5 http://homelab.tail84b6c.ts.net:8501
