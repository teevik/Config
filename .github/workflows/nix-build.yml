name: Build NixOS

on:
  workflow_call:
    inputs:
      host:
        description: Build this host, or desktop then zenbook when empty
        default: ""
        type: string
      update-packages:
        description: Update packages before building both hosts
        default: false
        type: boolean
      publish-cache:
        default: false
        type: boolean
      native-runner:
        description: Use the homelab runner reserved for nightly builds on main
        default: false
        type: boolean
    secrets:
      NIX_CACHE_SSH_KEY:
        required: false
      NIX_CACHE_SIGNING_KEY:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: ${{ inputs.host == '' && 'Build and scan desktop then zenbook' || format('Build and scan {0}', inputs.host) }}
    if: ${{ !inputs.native-runner || (github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) }}
    runs-on: ${{ inputs.native-runner && 'homelab-config-nightly' || 'ubuntu-latest' }}
    timeout-minutes: 360
    env:
      PUBLISH_CACHE: ${{ inputs.publish-cache }}
    steps:
      - name: Check out Config and its submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate host and log nixpkgs revision
        env:
          HOST: ${{ inputs.host }}
        run: |
          case "$HOST" in
            ''|desktop|zenbook) ;;
            *) echo "::error::Unsupported host: $HOST"; exit 2 ;;
          esac
          echo "nixpkgs rev: $(jq -r '.nodes[.nodes[.root].inputs.nixpkgs].locked.rev' flake.lock)"
          echo "NIX_CACHE_VERIFIED_PATHS=$RUNNER_TEMP/nix-cache-verified-paths.json" >> "$GITHUB_ENV"

      - name: Free runner disk space
        if: ${{ !inputs.native-runner }}
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /opt/az \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "Disk space after cleanup:"
          df -h /

      - name: Check private cache access configuration
        if: ${{ !inputs.native-runner }}
        env:
          CACHE_CLIENT_ID: ${{ vars.NIX_CACHE_TS_CLIENT_ID }}
          CACHE_AUDIENCE: ${{ vars.NIX_CACHE_TS_AUDIENCE }}
          CACHE_POLICY_READY: ${{ vars.NIX_CACHE_POLICY_READY }}
        run: |
          test -n "$CACHE_CLIENT_ID" && test -n "$CACHE_AUDIENCE"
          test "$CACHE_POLICY_READY" = true

      - name: Connect to the private cache
        if: ${{ !inputs.native-runner }}
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ vars.NIX_CACHE_TS_CLIENT_ID }}
          audience: ${{ vars.NIX_CACHE_TS_AUDIENCE }}
          tags: tag:config-cache-ci
          ping: homelab.tail84b6c.ts.net

      - name: Install Nix
        if: ${{ !inputs.native-runner }}
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5
        with:
          extra-conf: |
            extra-experimental-features = parallel-eval
            eval-cores = 0
            lazy-trees = true
            accept-flake-config = true
            connect-timeout = 5
            fallback = true
            substituters = http://homelab.tail84b6c.ts.net:8501 https://cache.nixos.org
            trusted-public-keys = homelab-cache-1:e0A0wubKr+XqKPA/MeUY5ixaG+1HvBBImTkPzrNJT4s= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= teevik.cachix.org-1:lh2jXPvLIaTNsL8e8gvrI2abYe83tKhV0PmxQOGlitQ= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= cache.flakehub.com-4:Asi8qIv291s0aYLyH6IOnr5Kf6+OF14WVjkE6t3xMio= cache.flakehub.com-5:zB96CRlL7tiPtzA9/WKyPkp3A2vqxqgdgyTVNGShPDU= cache.flakehub.com-6:W4EGFwAGgBj3he7c5fNh9NkOXw0PUVaxygCVKeuvaqU= cache.flakehub.com-7:mvxJ2DZVHn/kRxlIaxYNMuDG1OvMckZu32um1TadOR8= cache.flakehub.com-8:moO+OVS0mnTjBTcOUh2kYLQEd59ExzyoW1QgQ8XAARQ= cache.flakehub.com-9:wChaSeTI6TeCuV/Sg2513ZIM9i0qJaYsF+lZCXg0J6o= cache.flakehub.com-10:2GqeNlIp6AKp4EF2MVbE1kBOp9iBSyo0UPR9KoR0o1Y= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk=

      - name: Update flake inputs and packages
        if: inputs.update-packages
        env:
          NIX_CACHE_SSH_KEY: ${{ secrets.NIX_CACHE_SSH_KEY }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          # Resolve just from the same locked nixpkgs as this checkout.
          nixpkgs_rev=$(jq -r '.nodes[.nodes[.root].inputs.nixpkgs].locked.rev' flake.lock)
          python3 .github/cache/build.py updater "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -- \
            nix shell "github:NixOS/nixpkgs/$nixpkgs_rev#just" .#nix-update \
            -c just update --export "$RUNNER_TEMP/nightly-update"
          echo "Updated nixpkgs rev: $(jq -r '.nodes[.nodes[.root].inputs.nixpkgs].locked.rev' flake.lock)"

      - name: Build and load cargo-nix-plugin with its matching Nix
        env:
          NIX_CACHE_SSH_KEY: ${{ secrets.NIX_CACHE_SSH_KEY }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          bootstrap=(bash .github/cache/bootstrap.sh "$RUNNER_TEMP/bootstrap-paths")
          if [[ "$PUBLISH_CACHE" == true ]]; then
            python3 .github/cache/build.py bootstrap "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -- "${bootstrap[@]}"
          else
            "${bootstrap[@]}"
          fi
          mapfile -t bootstrap < "$RUNNER_TEMP/bootstrap-paths"
          echo "${bootstrap[0]}/bin" >> "$GITHUB_PATH"
          {
            echo 'NIX_CONFIG<<CARGO_NIX_CONFIG'
            printf '%s\n' "${NIX_CONFIG:-}"
            echo "plugin-files = ${bootstrap[1]}/lib/nix/plugins"
            echo 'CARGO_NIX_CONFIG'
          } >> "$GITHUB_ENV"

      - name: Upload nightly update
        if: inputs.update-packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-update
          path: ${{ runner.temp }}/nightly-update
          if-no-files-found: error
          retention-days: 7

      - name: Build pinned security tools
        id: tools
        env:
          HOST: ${{ inputs.host }}
          NIX_CACHE_SSH_KEY: ${{ secrets.NIX_CACHE_SSH_KEY }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          build=(nix build --file packages/security/default.nix --out-link "$RUNNER_TEMP/security-tools")
          if [[ "$PUBLISH_CACHE" == true ]]; then
            python3 .github/cache/build.py "${HOST:-bootstrap}" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -- "${build[@]}"
          else
            "${build[@]}"
          fi
          package=$(readlink -f "$RUNNER_TEMP/security-tools")
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Build, retain and scan desktop
        id: desktop
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && (inputs.host == '' || inputs.host == 'desktop') }}
        env:
          NIX_CACHE_SSH_KEY: ${{ secrets.NIX_CACHE_SSH_KEY }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          SCAN_SCOPE: ${{ inputs.update-packages && 'candidate' || 'committed' }}
          SCANNER: ${{ steps.tools.outputs.package }}/bin/nix-security-scan
        run: bash .github/cache/host.sh desktop

      - name: Retain encrypted desktop security report
        if: ${{ !cancelled() && steps.desktop.outputs.scan-started == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-desktop
          path: |
            ${{ runner.temp }}/security-desktop/report.tar.gz.age
            ${{ runner.temp }}/security-desktop/summary.json
            ${{ runner.temp }}/security-desktop/summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Build, retain and scan zenbook
        id: zenbook
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && (inputs.host == '' || inputs.host == 'zenbook') }}
        env:
          NIX_CACHE_SSH_KEY: ${{ secrets.NIX_CACHE_SSH_KEY }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          SCAN_SCOPE: ${{ inputs.update-packages && 'candidate' || 'committed' }}
          SCANNER: ${{ steps.tools.outputs.package }}/bin/nix-security-scan
        run: bash .github/cache/host.sh zenbook

      - name: Retain encrypted zenbook security report
        if: ${{ !cancelled() && steps.zenbook.outputs.scan-started == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-zenbook
          path: |
            ${{ runner.temp }}/security-zenbook/report.tar.gz.age
            ${{ runner.temp }}/security-zenbook/summary.json
            ${{ runner.temp }}/security-zenbook/summary.md
          if-no-files-found: error
          retention-days: 30
