name: Weekly security scan

on:
  schedule:
    - cron: "43 5 * * 1"
      timezone: Europe/Oslo
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: weekly-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan committed desktop then zenbook
    uses: ./.github/workflows/build.yml
