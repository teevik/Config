# Weekly (Monday morning, or on manual dispatch from any branch): build the
# committed desktop and zenbook configurations and scan them for known
# vulnerabilities, and report how stale the locked Nixpkgs inputs are. Reads
# from the private cache but never publishes to it.
name: Weekly security scan

on:
  schedule:
    - cron: "43 5 * * 1"
      timezone: Europe/Oslo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Informational and not actionable for transitive inputs: weekly, not per push.
  nixpkgs-freshness:
    name: Nixpkgs freshness (advisory)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Include transitive Nixpkgs inputs
        id: inputs
        run: |
          keys=$(python3 packages/security/lock_inputs.py flake.lock "$RUNNER_TEMP/nixpkgs.lock")
          echo "keys=$keys" >> "$GITHUB_OUTPUT"
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14
        with:
          flake-lock-path: ${{ runner.temp }}/nixpkgs.lock
          nixpkgs-keys: ${{ steps.inputs.outputs.keys }}
          ignore-missing-flake-lock: false
          # Existing transitive inputs are stale; report them while we migrate.
          fail-mode: false
          send-statistics: false

  scan:
    name: Scan committed desktop then zenbook
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out Config and its submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Nix with the private cache
        uses: ./.github/actions/setup-nix
        with:
          publish-cache: "false"
          tailscale-client-id: ${{ vars.NIX_CACHE_TS_CLIENT_ID }}
          tailscale-audience: ${{ vars.NIX_CACHE_TS_AUDIENCE }}
          cache-policy-ready: ${{ vars.NIX_CACHE_POLICY_READY }}

      - name: Build pinned security tools
        id: tools
        uses: ./.github/actions/security-tools

      - name: Build and scan desktop
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        uses: ./.github/actions/build-host
        with:
          host: desktop
          scan-scope: committed
          scanner: ${{ steps.tools.outputs.package }}/bin/nix-security-scan

      - name: Build and scan zenbook
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        uses: ./.github/actions/build-host
        with:
          host: zenbook
          scan-scope: committed
          scanner: ${{ steps.tools.outputs.package }}/bin/nix-security-scan
