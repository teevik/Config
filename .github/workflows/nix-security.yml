name: Nix security

on:
  schedule:
    - cron: "43 5 * * 1"
      timezone: Europe/Oslo
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nix-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan committed desktop then zenbook
    uses: ./.github/workflows/nix-build.yml
