# Runs on every push and pull request (or manual dispatch). Needs no secrets
# or Tailscale: builds the file-based checks via tests/lint-checks.nix and
# evaluates the flake without building its checks.
name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint checks
    runs-on: ubuntu-24.04
    # Longest successful run: 9m30s (2026-10-10); a hung job should not run six hours.
    timeout-minutes: 60
    steps:
      - name: Check out Config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - name: Build every checks/*.nix check
        run: nix build --file tests/lint-checks.nix --no-link --print-build-logs
      - name: Check flake cache substitution and retention
        # These checks exercise Determinate Nix's flake-check out links.
        run: python3 tests/cache-checks.py
      - name: Evaluate flake outputs without building checks
        run: |
          # Prepare derivations and IFD sources before --no-build enables
          # read-only evaluation. This does not build the check results.
          nix eval --json .#checks.x86_64-linux --apply 'builtins.mapAttrs (_: p: p.drvPath)' > /dev/null
          nix flake check --no-build
