name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint checks
    runs-on: ubuntu-24.04
    # Longest successful run: 9m30s (2026-10-10); a hung job should not run six hours.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out Config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Connect to the private cache
        id: tailscale
        # Best effort: forks have no OIDC token or variables, and a tailnet
        # outage must not block lint. Without it the checks build from source.
        continue-on-error: true
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ vars.NIX_CACHE_TS_CLIENT_ID }}
          audience: ${{ vars.NIX_CACHE_TS_AUDIENCE }}
          tags: tag:config-cache-ci
          ping: homelab.tail84b6c.ts.net
      - name: Assemble the Nix configuration
        id: nix-conf
        env:
          PRIVATE_CACHE: ${{ steps.tailscale.outcome }}
        run: |
          if [[ "$PRIVATE_CACHE" == success ]]; then
            bash .github/ci/nix-conf.sh --github-output
          else
            echo "::warning::Private cache unreachable; lint checks build from the public cache only"
            bash .github/ci/nix-conf.sh --github-output --public-only
          fi
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
        with:
          extra-conf: ${{ steps.nix-conf.outputs.conf }}
      - name: Build every checks/*.nix check
        run: nix build --file tests/lint-checks.nix --no-link --print-build-logs
      - name: Check flake cache substitution and retention
        # These checks exercise Determinate Nix's flake-check out links.
        run: python3 tests/cache-checks.py
      - name: Evaluate flake outputs without building checks
        run: |
          # Prepare derivations and IFD sources before --no-build enables
          # read-only evaluation. This does not build the check results.
          nix eval --json .#checks.x86_64-linux --apply 'builtins.mapAttrs (_: p: p.drvPath)' > /dev/null
          nix flake check --no-build
