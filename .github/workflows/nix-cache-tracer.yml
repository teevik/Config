name: Nix cache

on:
  # Scheduled workflows are best-effort and may be delayed or disabled after
  # 60 days without repository activity.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nix-cache-nightly-flake-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lock:
    name: Update flake lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Config and its submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # GitHub deploy keys belong to one repository, so each private flake
      # input needs its own key. The key comments let ssh-agent route each
      # repository fetch to the correct key.
      - name: Configure SSH for private flake inputs
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.MARBLE_SHELL_DEPLOY_KEY }}
            ${{ secrets.ASTAL_DEPLOY_KEY }}

      - name: Trust GitHub's SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            substituters = https://cache.nixos.org https://teevik.cachix.org https://cache.numtide.com https://nyx-cache.chaotic.cx
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= teevik.cachix.org-1:lh2jXPvLIaTNsL8e8gvrI2abYe83tKhV0PmxQOGlitQ= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk=

      - name: Update flake inputs and packages
        run: |
          nix flake update
          nix run nixpkgs#just -- update
          echo "nixpkgs rev: $(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)"

      - name: Upload nightly update
        uses: actions/upload-artifact@v4
        with:
          name: nightly-update
          path: |
            flake.lock
            packages/t3code-nightly.nix
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.host }}
    needs: update-lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host:
          - desktop
          - zenbook
    steps:
      - name: Check out Config and its submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download nightly update
        uses: actions/download-artifact@v4
        with:
          name: nightly-update
          path: .

      - name: Log shared nixpkgs revision
        run: |
          echo "nixpkgs rev: $(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)"

      # GitHub deploy keys belong to one repository, so each private flake
      # input needs its own key. The key comments let ssh-agent route each
      # repository fetch to the correct key.
      - name: Configure SSH for private flake inputs
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.MARBLE_SHELL_DEPLOY_KEY }}
            ${{ secrets.ASTAL_DEPLOY_KEY }}

      - name: Trust GitHub's SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Free runner disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /opt/az \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "Disk space after cleanup:"
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            substituters = https://cache.nixos.org https://teevik.cachix.org https://cache.numtide.com https://nyx-cache.chaotic.cx
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= teevik.cachix.org-1:lh2jXPvLIaTNsL8e8gvrI2abYe83tKhV0PmxQOGlitQ= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk=

      # Daemon mode streams each locally built path as it finishes and honours
      # pushFilter. Passing --cachix-cache to nix-fast-build would bypass the
      # filter for private-input outputs.
      - name: Configure Cachix streaming uploads
        uses: cachix/cachix-action@v17
        with:
          name: teevik
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: (marble|astal)

      - name: Build ${{ matrix.host }} and stream outputs to Cachix
        run: |
          disk_samples="$RUNNER_TEMP/disk-usage.log"
          while true; do
            df -B1 --output=used,avail / | tail -n 1 >> "$disk_samples"
            sleep 30
          done &
          disk_monitor_pid=$!

          report_disk_high_water_mark() {
            kill "$disk_monitor_pid" 2>/dev/null || true
            wait "$disk_monitor_pid" 2>/dev/null || true
            awk '
              NR == 1 || $1 > max_used { max_used = $1 }
              NR == 1 || $2 < min_free { min_free = $2 }
              END {
                printf "Disk high-water mark: %.1f GiB used; minimum free: %.1f GiB\n", max_used / 2^30, min_free / 2^30
              }
            ' "$disk_samples"
            df -h /
          }
          trap report_disk_high_water_mark EXIT

          nix run github:Mic92/nix-fast-build -- \
            --skip-cached \
            --no-nom \
            --flake ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  pull-request:
    name: Open nightly update pull request
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Config
        uses: actions/checkout@v4

      - name: Download the built nightly update
        uses: actions/download-artifact@v4
        with:
          name: nightly-update
          path: ${{ runner.temp }}/nightly-update

      - name: Install the built update and summarize input changes
        id: input-changes
        run: |
          git show HEAD:flake.lock > "$RUNNER_TEMP/flake.lock.before"
          cp "$RUNNER_TEMP/nightly-update/flake.lock" flake.lock
          cp "$RUNNER_TEMP/nightly-update/packages/t3code-nightly.nix" packages/t3code-nightly.nix

          rows="$(
            jq -r --slurpfile old "$RUNNER_TEMP/flake.lock.before" '
              ($old[0].nodes // {}) as $before
              | (.nodes // {}) as $after
              | ((($before | keys) + ($after | keys)) | unique[]) as $name
              | ($before[$name].locked // null) as $old_lock
              | ($after[$name].locked // null) as $new_lock
              | select($old_lock != $new_lock)
              | "| `\($name)` | `\($old_lock.rev // "not present")` | `\($new_lock.rev // "not present")` |"
            ' flake.lock
          )"

          {
            echo 'body<<EOF'
            echo 'Automated flake input and package update. Every configured host was built and pushed to Cachix using these exact files.'
            echo
            echo '### Changed inputs'
            echo
            echo '| Input | Old revision | New revision |'
            echo '| --- | --- | --- |'
            if [[ -n "$rows" ]]; then
              echo "$rows"
            else
              echo '| _No locked inputs changed_ | — | — |'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update the nightly pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            flake.lock
            packages/t3code-nightly.nix
          commit-message: "chore: update flake inputs and packages"
          branch: nightly/flake-update
          base: main
          title: "chore: update flake inputs and packages"
          body: ${{ steps.input-changes.outputs.body }}
