name: Nix cache

on:
  # Scheduled workflows are best-effort and may be delayed or disabled after
  # 60 days without repository activity.
  schedule:
    - cron: "17 3 * * *"
      timezone: "Europe/Oslo"
  workflow_dispatch:

concurrency:
  group: nix-cache-nightly-flake-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Update and build both hosts
    permissions:
      contents: read
      id-token: write
    # Keep both hosts in one job: the Nix store and source/evaluation caches
    # are reused without a separate shared-dependency planner or artifact hop.
    # The native runner enforces this caller and reusable workflow on main.
    uses: ./.github/workflows/nix-build.yml
    with:
      update-packages: true
      publish-cache: true
      native-runner: true

  pull-request:
    name: Open nightly update pull request
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the built nightly update
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-update
          path: ${{ runner.temp }}/nightly-update

      - name: Install the built update and summarize input changes
        id: input-changes
        run: |
          git show HEAD:flake.lock > "$RUNNER_TEMP/flake.lock.before"
          python3 .github/cache/install-update.py "$RUNNER_TEMP/nightly-update"
          {
            echo 'files<<UPDATE_FILES'
            cat "$RUNNER_TEMP/nightly-update/files.txt"
            echo 'UPDATE_FILES'
          } >> "$GITHUB_OUTPUT"

          rows="$(
            jq -r --slurpfile old "$RUNNER_TEMP/flake.lock.before" '
              ($old[0].nodes // {}) as $before
              | (.nodes // {}) as $after
              | ((($before | keys) + ($after | keys)) | unique[]) as $name
              | ($before[$name].locked // null) as $old_lock
              | ($after[$name].locked // null) as $new_lock
              | select($old_lock != $new_lock)
              | "| `\($name)` | `\($old_lock.rev // "not present")` | `\($new_lock.rev // "not present")` |"
            ' flake.lock
          )"

          {
            echo 'body<<EOF'
            echo 'Automated flake input and package update. Desktop and zenbook were built and scanned using these exact files. Complete system closures were retained and verified in the private homelab cache.'
            echo
            echo 'Security scans are informational; see the per-host job summaries and encrypted security artifacts.'
            echo 'Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            echo
            echo '### Changed inputs'
            echo
            echo '| Input | Old revision | New revision |'
            echo '| --- | --- | --- |'
            if [[ -n "$rows" ]]; then
              echo "$rows"
            else
              echo '| _No locked inputs changed_ | — | — |'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # App-authenticated pushes and PR updates trigger CI without manual approval.
      - name: Create nightly GitHub App token
        id: nightly-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NIGHTLY_APP_CLIENT_ID }}
          private-key: ${{ secrets.NIGHTLY_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update the nightly pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.nightly-app.outputs.token }}
          add-paths: ${{ steps.input-changes.outputs.files }}
          commit-message: "chore: update flake inputs and packages"
          branch: nightly/flake-update
          base: main
          title: "chore: update flake inputs and packages"
          body: ${{ steps.input-changes.outputs.body }}
