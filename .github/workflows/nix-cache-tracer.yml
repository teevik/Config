name: Nix cache

on:
  # Scheduled workflows are best-effort and may be delayed or disabled after
  # 60 days without repository activity.
  schedule:
    - cron: "17 3 * * *"
      timezone: "Europe/Oslo"
  workflow_dispatch:

concurrency:
  group: nix-cache-nightly-flake-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-lock:
    name: Update flake lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Config and its submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # GitHub deploy keys belong to one repository, so each private flake
      # input needs its own key. The key comments let ssh-agent route each
      # repository fetch to the correct key.
      - name: Configure SSH for private flake inputs
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.MARBLE_SHELL_DEPLOY_KEY }}
            ${{ secrets.ASTAL_DEPLOY_KEY }}

      - name: Trust GitHub's SSH host key
        run: |
          mkdir -p ~/.ssh
          install -m 600 .github/security/github-known-hosts ~/.ssh/known_hosts

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5
        with:
          extra-conf: |
            extra-experimental-features = parallel-eval
            eval-cores = 0
            lazy-trees = true
            accept-flake-config = true
            connect-timeout = 5
            fallback = true
            substituters = https://cache.nixos.org https://teevik.cachix.org https://hyprland.cachix.org https://install.determinate.systems https://cache.numtide.com https://nyx-cache.chaotic.cx
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= teevik.cachix.org-1:lh2jXPvLIaTNsL8e8gvrI2abYe83tKhV0PmxQOGlitQ= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= cache.flakehub.com-4:Asi8qIv291s0aYLyH6IOnr5Kf6+OF14WVjkE6t3xMio= cache.flakehub.com-5:zB96CRlL7tiPtzA9/WKyPkp3A2vqxqgdgyTVNGShPDU= cache.flakehub.com-6:W4EGFwAGgBj3he7c5fNh9NkOXw0PUVaxygCVKeuvaqU= cache.flakehub.com-7:mvxJ2DZVHn/kRxlIaxYNMuDG1OvMckZu32um1TadOR8= cache.flakehub.com-8:moO+OVS0mnTjBTcOUh2kYLQEd59ExzyoW1QgQ8XAARQ= cache.flakehub.com-9:wChaSeTI6TeCuV/Sg2513ZIM9i0qJaYsF+lZCXg0J6o= cache.flakehub.com-10:2GqeNlIp6AKp4EF2MVbE1kBOp9iBSyo0UPR9KoR0o1Y= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk=

      - name: Reuse build outputs and configure remote builds
        uses: ./.github/actions/nixbuild
        with:
          token: ${{ secrets.NIXBUILD_TOKEN }}

      - name: Update flake inputs and packages
        run: |
          nix shell nixpkgs#just .#nix-update -c just update --export "$RUNNER_TEMP/nightly-update"
          echo "nixpkgs rev: $(jq -r '.nodes[.nodes[.root].inputs.nixpkgs].locked.rev' flake.lock)"

      - name: Upload nightly update
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-update
          path: ${{ runner.temp }}/nightly-update
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.host }}
    needs: update-lock
    strategy:
      fail-fast: false
      matrix:
        host: [desktop, zenbook]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/nix-build.yml
    with:
      host: ${{ matrix.host }}
      update-artifact: nightly-update
      publish-cache: true
    secrets:
      MARBLE_SHELL_DEPLOY_KEY: ${{ secrets.MARBLE_SHELL_DEPLOY_KEY }}
      ASTAL_DEPLOY_KEY: ${{ secrets.ASTAL_DEPLOY_KEY }}
      NIXBUILD_TOKEN: ${{ secrets.NIXBUILD_TOKEN }}
      NIX_CACHE_SSH_KEY: ${{ secrets.NIX_CACHE_SSH_KEY }}
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}

  pull-request:
    name: Open nightly update pull request
    permissions:
      contents: write
      pull-requests: write
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the built nightly update
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-update
          path: ${{ runner.temp }}/nightly-update

      - name: Install the built update and summarize input changes
        id: input-changes
        run: |
          git show HEAD:flake.lock > "$RUNNER_TEMP/flake.lock.before"
          cp -a "$RUNNER_TEMP/nightly-update/sources/." .
          {
            echo 'files<<UPDATE_FILES'
            cat "$RUNNER_TEMP/nightly-update/files.txt"
            echo 'UPDATE_FILES'
          } >> "$GITHUB_OUTPUT"

          rows="$(
            jq -r --slurpfile old "$RUNNER_TEMP/flake.lock.before" '
              ($old[0].nodes // {}) as $before
              | (.nodes // {}) as $after
              | ((($before | keys) + ($after | keys)) | unique[]) as $name
              | ($before[$name].locked // null) as $old_lock
              | ($after[$name].locked // null) as $new_lock
              | select($old_lock != $new_lock)
              | "| `\($name)` | `\($old_lock.rev // "not present")` | `\($new_lock.rev // "not present")` |"
            ' flake.lock
          )"

          {
            echo 'body<<EOF'
            echo 'Automated flake input and package update. Desktop and zenbook were built and scanned using these exact files. Complete system closures were retained and verified in the private homelab cache.'
            echo
            echo 'Security scans are informational; see the per-host job summaries and encrypted security artifacts.'
            echo 'Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            echo
            echo '### Changed inputs'
            echo
            echo '| Input | Old revision | New revision |'
            echo '| --- | --- | --- |'
            if [[ -n "$rows" ]]; then
              echo "$rows"
            else
              echo '| _No locked inputs changed_ | — | — |'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update the nightly pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: ${{ steps.input-changes.outputs.files }}
          commit-message: "chore: update flake inputs and packages"
          branch: nightly/flake-update
          base: main
          title: "chore: update flake inputs and packages"
          body: ${{ steps.input-changes.outputs.body }}
