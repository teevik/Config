# Nightly (03:17 Oslo, or on manual dispatch from main): update flake inputs
# and packages, build and scan both hosts and run the flake check against the
# update, publish everything to the private homelab cache, then open or
# refresh the update pull request. Failures are reported in a tracking issue.
name: Nightly update

on:
  # Scheduled workflows are best-effort and may be delayed or disabled after
  # 60 days without repository activity.
  schedule:
    - cron: "17 3 * * *"
      timezone: "Europe/Oslo"
  workflow_dispatch:

concurrency:
  # Single writer to the private homelab cache: every workflow that publishes
  # to it (main.yml, nightly-update.yml) shares this group, so cache uploads
  # never run in parallel.
  group: homelab-cache-writer
  # Let a running publish finish uploading before the next run starts.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Update and build both hosts
    # Only main may publish to the homelab cache.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Longest successful run: 3h30m (2026-09-16), and both hosts now build in
    # sequence, so a cold rebuild needs the GitHub maximum.
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    outputs:
      # Updates that failed but did not stop the night; see failures.json.
      failed-updates: ${{ steps.update.outputs.failed-updates }}
    # Keep both hosts in one job: the Nix store and source/evaluation caches
    # are reused without a separate shared-dependency planner or artifact hop.
    steps:
      - name: Check out Config and its submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Nix with the private cache
        uses: ./.github/actions/setup-nix
        with:
          publish-cache: "true"
          tailscale-client-id: ${{ vars.NIX_CACHE_TS_CLIENT_ID }}
          tailscale-audience: ${{ vars.NIX_CACHE_TS_AUDIENCE }}
          cache-policy-ready: ${{ vars.NIX_CACHE_POLICY_READY }}
          nix-cache-ssh-key: ${{ secrets.NIX_CACHE_SSH_KEY }}
          nix-cache-signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}

      - name: Update flake inputs and packages
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NIX_CACHE_SSH_KEY: ${{ secrets.NIX_CACHE_SSH_KEY }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: bash .github/ci/update-packages.sh "$RUNNER_TEMP/nightly-update"

      - name: Upload nightly update
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-update
          path: ${{ runner.temp }}/nightly-update
          if-no-files-found: error
          retention-days: 7

      - name: Build pinned security tools
        id: tools
        uses: ./.github/actions/security-tools
        with:
          nix-cache-ssh-key: ${{ secrets.NIX_CACHE_SSH_KEY }}
          nix-cache-signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}

      # A failed host must not stop the other host or the flake check.
      - name: Build, retain and scan desktop
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        uses: ./.github/actions/build-host
        with:
          host: desktop
          scan-scope: candidate
          scanner: ${{ steps.tools.outputs.package }}/bin/nix-security-scan
          nix-cache-ssh-key: ${{ secrets.NIX_CACHE_SSH_KEY }}
          nix-cache-signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}

      - name: Build, retain and scan zenbook
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        uses: ./.github/actions/build-host
        with:
          host: zenbook
          scan-scope: candidate
          scanner: ${{ steps.tools.outputs.package }}/bin/nix-security-scan
          nix-cache-ssh-key: ${{ secrets.NIX_CACHE_SSH_KEY }}
          nix-cache-signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}

      - name: Check flake and retain successful check outputs
        if: ${{ !cancelled() }}
        env:
          NIX_CACHE_SSH_KEY: ${{ secrets.NIX_CACHE_SSH_KEY }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: bash .github/ci/check.sh

  pull-request:
    name: Open nightly update pull request
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the built nightly update
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-update
          path: ${{ runner.temp }}/nightly-update

      - name: Install the built update and write the pull request body
        id: input-changes
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git show HEAD:flake.lock > "$RUNNER_TEMP/flake.lock.before"
          python3 .github/ci/install-update.py "$RUNNER_TEMP/nightly-update"
          {
            echo 'files<<UPDATE_FILES'
            cat "$RUNNER_TEMP/nightly-update/files.txt"
            echo 'UPDATE_FILES'
          } >> "$GITHUB_OUTPUT"
          # Failed updates were left out of the artifact; the script warns about
          # them in the log and lists them in the body.
          python3 .github/ci/pr-body.py "$RUNNER_TEMP/flake.lock.before" flake.lock \
            "$RUNNER_TEMP/nightly-update" "$RUN_URL" "$RUNNER_TEMP/pr-body.md"

      # App-authenticated pushes and PR updates trigger CI without manual approval.
      - name: Create nightly GitHub App token
        id: nightly-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NIGHTLY_APP_CLIENT_ID }}
          private-key: ${{ secrets.NIGHTLY_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update the nightly pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.nightly-app.outputs.token }}
          add-paths: ${{ steps.input-changes.outputs.files }}
          commit-message: "chore: update flake inputs and packages"
          branch: nightly/flake-update
          base: main
          title: "chore: update flake inputs and packages"
          body-path: ${{ runner.temp }}/pr-body.md

  # Any failure above means no update, no PR or no cache refresh. A package
  # update that failed while the rest succeeded only shows up in the PR body,
  # and there is no PR when nothing else changed, so report that here too. Uses
  # the workflow token: the nightly GitHub App may lack the issues permission.
  notify-failure:
    name: Report nightly failure
    needs: [build, pull-request]
    if: ${{ failure() || (needs.build.result == 'success' && needs.build.outputs.failed-updates != '') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out Config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or update the nightly failure issue
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_UPDATES: ${{ needs.build.outputs.failed-updates }}
        run: bash .github/ci/notify-failure.sh
