$display = Ubuntu Nerd Font
$utility = JetBrainsMono Nerd Font

# Catppuccin Mocha, with Lavender as the single visual accent.
$crust = rgb(11111b)
$mantle = rgba(181825e6)
$text = rgb(cdd6f4)
$lavender = rgb(b4befe)
$mauve = rgb(cba6f7)
$red = rgb(f38ba8)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 1800
}

auth {
    pam {
        enabled = true
        module = @pam-module@
    }
}

animations {
    enabled = true
    bezier = ease, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 5, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 3, ease
}

background {
    monitor =
    path = @wallpaper@
    blur_passes = 3
    blur_size = 6
    brightness = 0.48
    contrast = 1.05
    vibrancy = 0.10
    noise = 0.006
}

# A soft lavender halo gives the password field depth without adding clutter.
shape {
    monitor =
    size = 568, 96
    rounding = 48
    color = rgba(b4befe14)
    position = 0, -70
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 18
    shadow_color = rgba(b4befe40)
    zindex = 1
}

label {
    monitor =
    text = $TIME
    color = $lavender
    font_size = 112
    font_family = $display
    position = 0, 75
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = $crust
    zindex = 2
}

input-field {
    monitor =
    size = 540, 76
    outline_thickness = 3
    rounding = 38
    dots_size = 0.18
    dots_spacing = 0.28
    dots_center = true
    outer_color = $lavender
    inner_color = $mantle
    font_color = $text
    check_color = $lavender
    fail_color = $red
    capslock_color = $mauve
    fade_on_empty = false
    placeholder_text = Password
    check_text = <i>Authenticating…</i>
    fail_text = <i>$PAMFAIL</i>
    font_family = $utility
    position = 0, -70
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(11111bb3)
    zindex = 2
}
