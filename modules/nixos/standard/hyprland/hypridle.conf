general {
    # loginctl lock-session and suspend events both arrive here. The wrapper
    # makes repeated lock requests idempotent.
    lock_cmd = @lock-screen@
    before_sleep_cmd = @loginctl@ lock-session
    after_sleep_cmd = @hyprctl@ dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = @brightnessctl@ -s set 50%-
    on-resume = @brightnessctl@ -r
}

listener {
    timeout = 600
    on-timeout = @loginctl@ lock-session
}

listener {
    timeout = 620
    on-timeout = @hyprctl@ dispatch dpms off
    on-resume = @hyprctl@ dispatch dpms on
}

# Deliberately no suspend listener: background jobs and agents keep running
# while the session is locked and the displays are powered down.
